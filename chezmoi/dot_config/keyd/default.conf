# Symlinked from /etc/keyd/default.conf (see apps/keyd.yaml).
# Run `sudo keyd reload` after changing this file.

[ids]
*

[main]
# Tap Alt alone to send Muhenkan/Henkan (IME off/on in fcitx5), hold for normal Alt.
# This also prevents apps from focusing their menu bar on a lone Alt press.
leftalt = overload(alt, muhenkan)
rightalt = overload(alt, henkan)
