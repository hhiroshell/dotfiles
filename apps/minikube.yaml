name: minikube

# cf. https://minikube.sigs.k8s.io/docs/start/
install:
  - type: custom
    os: linux
    check: command -v minikube
    version_cmd: minikube version --short 2>/dev/null
    latest_cmd: curl -sS --max-time 10 "https://api.github.com/repos/kubernetes/minikube/releases/latest" | jq -r '.tag_name'
    script: |
      MINIKUBE_VERSION=$(curl -sS "https://api.github.com/repos/kubernetes/minikube/releases/latest" | jq -r '.tag_name')
      curl -Lo /tmp/minikube "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
      chmod +x /tmp/minikube
      sudo mv /tmp/minikube /usr/local/bin/minikube
    uninstall: |
      sudo rm -f /usr/local/bin/minikube
