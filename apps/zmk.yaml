name: zmk

requires:
  - uv

# cf. https://zmk.dev/docs/user-setup
install:
  - type: custom
    os: linux
    check: command -v zmk
    version_cmd: zmk --version 2>/dev/null
    latest_cmd: curl -s https://pypi.org/pypi/zmk/json | jq -r '.info.version'
    script: |
      uv tool install zmk
    uninstall: |
      uv tool uninstall zmk
