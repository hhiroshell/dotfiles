name: orca

# cf. https://www.onorca.dev/docs/install
install:
  - type: brew
    cask: stablyai/orca/orca
    os: macos

  - type: custom
    os: linux
    check: command -v orca-ide
    version_cmd: dpkg-query -W -f='${Version}' orca-ide 2>/dev/null
    latest_cmd: curl -sS --max-time 10 "https://api.github.com/repos/stablyai/orca/releases/latest" | jq -r '.tag_name | ltrimstr("v")'
    script: |
      ORCA_VERSION=$(curl -sS "https://api.github.com/repos/stablyai/orca/releases/latest" | jq -r '.tag_name | ltrimstr("v")')
      ARCH=$(dpkg --print-architecture)
      curl -fLo /tmp/orca-ide.deb "https://github.com/stablyai/orca/releases/download/v${ORCA_VERSION}/orca-ide_${ORCA_VERSION}_${ARCH}.deb"
      sudo apt-get install -y /tmp/orca-ide.deb
      rm /tmp/orca-ide.deb
    uninstall: |
      sudo apt-get remove -y orca-ide
