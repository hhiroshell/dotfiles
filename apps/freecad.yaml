name: freecad

# cf. https://github.com/FreeCAD/FreeCAD/releases
install:
  - type: custom
    os: linux
    check: command -v freecad
    version_cmd: freecad freecadcmd --version 2>/dev/null | head -1 | awk '{print $2}' | tr -d ','
    latest_cmd: curl -sS --max-time 10 "https://api.github.com/repos/FreeCAD/FreeCAD/releases/latest" | jq -r '.tag_name'
    script: |
      sudo apt-get install -y libfuse2t64
      FREECAD_URL=$(curl -sS --max-time 10 "https://api.github.com/repos/FreeCAD/FreeCAD/releases/latest" | jq -r '.assets[] | select(.name | test("Linux-x86_64.*\\.AppImage$")) | .browser_download_url')
      curl -Lo /tmp/freecad.AppImage "$FREECAD_URL"
      chmod +x /tmp/freecad.AppImage
      sudo install /tmp/freecad.AppImage /usr/local/bin/freecad
      rm /tmp/freecad.AppImage
    uninstall: |
      sudo rm -f /usr/local/bin/freecad
